name: pocket_notes
description: Pocket Notes - SQLite records with persistent dark mode.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0            # SQLite database
  path: ^1.9.0               # Builds the database file path safely
  shared_preferences: ^2.5.0 # Saves the theme choice on disk
  sqflite_common_ffi: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
flutter:
  uses-material-design: true
